<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Analog IC Design Portfolio</title>
  <desc id="desc">A navy electronic engineering banner with circuit traces, a differential pair motif, and the portfolio structure.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020817"/>
      <stop offset="0.55" stop-color="#071a33"/>
      <stop offset="1" stop-color="#0a3158"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.52" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="45%" r="55%">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.27"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8ca0c8" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="22" fill="url(#grid)"/>
  <rect width="1200" height="360" rx="22" fill="url(#glow)"/>

  <g fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.82">
    <path d="M745 62h72v37h52"/>
    <path d="M745 298h72v-37h52"/>
    <path d="M1156 96h-78v45h-52"/>
    <path d="M1156 264h-78v-45h-52"/>
    <path d="M893 113v47h-52"/>
    <path d="M1002 113v47h52"/>
    <path d="M893 247v-47h-52"/>
    <path d="M1002 247v-47h52"/>
    <path d="M841 160v40"/>
    <path d="M1054 160v40"/>
    <path d="M947 85v55"/>
    <path d="M947 220v55"/>
  </g>

  <g fill="#0b1427" stroke="url(#accent)" stroke-width="3" filter="url(#softGlow)">
    <rect x="869" y="82" width="48" height="64" rx="8"/>
    <rect x="978" y="82" width="48" height="64" rx="8"/>
    <rect x="869" y="214" width="48" height="64" rx="8"/>
    <rect x="978" y="214" width="48" height="64" rx="8"/>
    <circle cx="841" cy="180" r="8"/>
    <circle cx="1054" cy="180" r="8"/>
    <circle cx="947" cy="180" r="12"/>
  </g>

  <g fill="#d8e5ff">
    <circle cx="745" cy="62" r="5"/>
    <circle cx="745" cy="298" r="5"/>
    <circle cx="1156" cy="96" r="5"/>
    <circle cx="1156" cy="264" r="5"/>
  </g>

  <text x="70" y="86" fill="#67e8f9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="4">ANALOG ELECTRONIC DESIGN</text>
  <text x="66" y="153" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="52" font-weight="750">Analog IC Design</text>
  <text x="68" y="208" fill="url(#accent)" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="52" font-weight="750">Portfolio</text>
  <text x="70" y="254" fill="#adbad6" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19">gm/ID sizing · feedback · noise · stability · PVT · Monte Carlo</text>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="70" y="286" width="160" height="34" rx="17" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.5"/>
    <text x="150" y="308" text-anchor="middle" fill="#a5f3fc" font-size="13" font-weight="650">2 MINI PROJECTS</text>
    <rect x="242" y="286" width="190" height="34" rx="17" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.5"/>
    <text x="337" y="308" text-anchor="middle" fill="#bae6fd" font-size="13" font-weight="650">2 DESIGN CHALLENGES</text>
    <rect x="444" y="286" width="146" height="34" rx="17" fill="#2563eb" fill-opacity="0.16" stroke="#60a5fa" stroke-opacity="0.55"/>
    <text x="517" y="308" text-anchor="middle" fill="#bfdbfe" font-size="13" font-weight="650">13 OTHER LABS</text>
  </g>

  <rect x="1.5" y="1.5" width="1197" height="357" rx="20.5" fill="none" stroke="#ffffff" stroke-opacity="0.11" stroke-width="3"/>
</svg>
